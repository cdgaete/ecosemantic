[project]
name = "ecosemantic-view"
version = "0.1.6"
description = "The API of the EcoSemantic page, and the built page."
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [{ name = "Carlos Gaete-Morales", email = "cdgaete@gmail.com" }]
keywords = ["life cycle assessment", "LCA", "MCP", "web page", "review"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "ecosemantic-engine==0.1.6",
    "ecosemantic-core==0.1.6",
    "ecosemantic-mcp==0.1.6",
    "fastmcp>=4,<5",
    "fastmcp-slim>=4,<5",
    "mcp>=2.2.0,<3",
    "pydantic>=2.7,<3",
    "starlette>=1.6.0,<2",
    "sse-starlette>=3.4.11,<4",
]

[tool.uv.sources]
ecosemantic-core = { workspace = true }
ecosemantic-mcp = { workspace = true }

[project.urls]
Homepage = "https://github.com/cdgaete/ecosemantic"
Repository = "https://github.com/cdgaete/ecosemantic"
Issues = "https://github.com/cdgaete/ecosemantic/issues"
Changelog = "https://github.com/cdgaete/ecosemantic/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["ecosemantic/view/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["ecosemantic"]
