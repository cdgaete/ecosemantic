[project]
name = "ecosemantic-relay"
version = "0.1.20"
description = "The EcoSemantic bridge tunnel: its messages, its frames, the bridge's discovery document and the Ed25519 proof a bridged request carries."
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [{ name = "Carlos Gaete-Morales", email = "cdgaete@gmail.com" }]
keywords = ["life cycle assessment", "LCA", "bridge", "tunnel", "Ed25519"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
    "pyjwt[crypto]>=2.10,<3",
    "cryptography>=44,<51",
]

[project.urls]
Homepage = "https://github.com/cdgaete/ecosemantic"
Repository = "https://github.com/cdgaete/ecosemantic"
Issues = "https://github.com/cdgaete/ecosemantic/issues"
Changelog = "https://github.com/cdgaete/ecosemantic/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecosemantic"]
