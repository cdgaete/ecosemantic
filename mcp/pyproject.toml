[project]
name = "ecosemantic-mcp"
version = "0.1.7"
description = "The EcoSemantic MCP tools and the server that registers them."
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [{ name = "Carlos Gaete-Morales", email = "cdgaete@gmail.com" }]
keywords = ["life cycle assessment", "LCA", "MCP", "Model Context Protocol", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "ecosemantic-engine==0.1.7",
    "ecosemantic-core==0.1.7",
    "fastmcp>=4,<5",
    "fastmcp-slim>=4,<5",
    "mcp>=2.2.0,<3",
    "opentelemetry-api>=1.44,<2",
    "pydantic>=2.7,<3",
]

[tool.uv.sources]
ecosemantic-core = { workspace = true }

[project.urls]
Homepage = "https://github.com/cdgaete/ecosemantic"
Repository = "https://github.com/cdgaete/ecosemantic"
Issues = "https://github.com/cdgaete/ecosemantic/issues"
Changelog = "https://github.com/cdgaete/ecosemantic/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecosemantic"]
