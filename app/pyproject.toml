[project]
name = "ecosemantic"
version = "0.1.9"
description = "Agent-driven life cycle assessment on your own machine: the command and the local composition."
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [{ name = "Carlos Gaete-Morales", email = "cdgaete@gmail.com" }]
keywords = ["life cycle assessment", "LCA", "MCP", "openLCA", "ecoinvent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "ecosemantic-engine==0.1.9",
    "ecosemantic-core==0.1.9",
    "ecosemantic-databases[ecoinvent]==0.1.9",
    "ecosemantic-mcp==0.1.9",
    "ecosemantic-view==0.1.9",
    "fastmcp>=4,<5",
    "fastmcp-slim>=4,<5",
    "opentelemetry-api>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-common>=1.44,<2",
    "opentelemetry-sdk>=1.44,<2",
    "pydantic>=2.7,<3",
    "starlette>=1.6.0,<2",
    "truststore>=0.10,<1",
    "uvicorn>=0.52.4,<1",
]

[project.optional-dependencies]
mkl = ["ecosemantic-engine[mkl]==0.1.9"]

[project.scripts]
ecosemantic = "ecosemantic.console:main"

[tool.uv.sources]
ecosemantic-core = { workspace = true }
ecosemantic-databases = { workspace = true }
ecosemantic-mcp = { workspace = true }
ecosemantic-view = { workspace = true }

[project.urls]
Homepage = "https://github.com/cdgaete/ecosemantic"
Repository = "https://github.com/cdgaete/ecosemantic"
Issues = "https://github.com/cdgaete/ecosemantic/issues"
Changelog = "https://github.com/cdgaete/ecosemantic/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecosemantic"]
