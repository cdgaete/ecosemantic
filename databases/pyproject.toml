[project]
name = "ecosemantic-databases"
version = "0.1.6"
description = "Native EcoSemantic bundles built from a source database's own files."
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [{ name = "Carlos Gaete-Morales", email = "cdgaete@gmail.com" }]
keywords = ["life cycle assessment", "LCA", "ecoinvent", "EcoSpold2", "openLCA"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "ecosemantic-engine==0.1.6",
    "ecosemantic-core==0.1.6",
    "pydantic>=2.7,<3",
    "olca-schema==2.4.0",
    "pyyaml>=6,<7",
    "numpy>=2.5",
    "scipy>=1.16",
    "lca-data-interface~=0.1",
]

[project.optional-dependencies]
ecoinvent = ["ecoinvent_interface==3.1", "python-calamine>=0.3,<1"]

[project.scripts]
ecosemantic-databases = "ecosemantic.databases.cli:main"

[tool.uv.sources]
ecosemantic-core = { workspace = true }

[project.urls]
Homepage = "https://github.com/cdgaete/ecosemantic"
Repository = "https://github.com/cdgaete/ecosemantic"
Issues = "https://github.com/cdgaete/ecosemantic/issues"
Changelog = "https://github.com/cdgaete/ecosemantic/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecosemantic"]
