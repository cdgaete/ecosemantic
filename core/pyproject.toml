[project]
name = "ecosemantic-core"
version = "0.1.8"
description = "The EcoSemantic ports, pure computations, portable format and filesystem storage."
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [{ name = "Carlos Gaete-Morales", email = "cdgaete@gmail.com" }]
keywords = ["life cycle assessment", "LCA", "openLCA", "JSON-LD", "product system"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "ecosemantic-engine==0.1.8",
    "pydantic>=2.7,<3",
    "olca-schema==2.4.0",
    "asteval>=1.0.10,<2",
    "duckdb>=1.5,<2",
    "numpy>=2.5",
    "scipy>=1.16",
    "filelock>=3.29.5,<4",
    "watchfiles>=1.0,<2",
    "pyyaml>=6.0.1,<7",
]

[project.urls]
Homepage = "https://github.com/cdgaete/ecosemantic"
Repository = "https://github.com/cdgaete/ecosemantic"
Issues = "https://github.com/cdgaete/ecosemantic/issues"
Changelog = "https://github.com/cdgaete/ecosemantic/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecosemantic"]
